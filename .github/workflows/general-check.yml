name: General check

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

jobs:
  check-code:
    # Skip automated release PRs (CI-Release); they are validated in release.yml
    if: |
      !contains(github.event.pull_request.labels.*.name, 'CI-Release')
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build packages (force)
        timeout-minutes: 15
        run: pnpm build:packages:force

      - name: Type check
        timeout-minutes: 10
        run: pnpm type-check

      - name: Lint
        timeout-minutes: 10
        run: pnpm lint:force

      - name: Test
        timeout-minutes: 10
        run: pnpm test:force

      - run: pnpm rebuild
