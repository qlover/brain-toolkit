packages:
  - packages/*
  - apps/*

peerDependencyRules:
  allowedVersions:
    eslint: '9 || 10'

overrides:
  typescript: ~6.0.3
  # Keep Next apps on one @types/react; 19.3+ breaks Heroicons → ComponentType<SVGProps>
  '@types/react': 19.2.2
  '@types/react-dom': 19.2.3
  '@typescript-eslint/types': ^8.60.1
  '@typescript-eslint/utils': ^8.60.1
  '@typescript-eslint/scope-manager': ^8.60.1
  '@typescript-eslint/typescript-estree': ^8.60.1
  '@typescript-eslint/parser': ^8.60.1
  # @vercel/oidc / @hookform/resolvers 对 zod minor 敏感；全仓钉死避免 4.4 vs 4.6 双实例
  zod: 4.6.7

# pnpm 11+: approve dependency lifecycle scripts (strictDepBuilds default true)
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js-pure: false
  esbuild: true
  nx: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@qlover/next-kit@1.4.0 || 1.5.0'
  - '@qlover/oauth-wrapper@0.10.0 || 0.11.1'
